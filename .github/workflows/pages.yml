name: Deploy to GitHub Pages

# Publishes the live app from main at /truss-spacer/ and, if they exist, previews of the
# v2 branch at /truss-spacer/v2/ and of the cad branch (the CAD rebuild, built with npm) at /truss-spacer/cad/.
# A push to v2 runs the small "Preview v2" workflow on that branch, which triggers this one
# here on main (workflow_run), so the deploy always runs from main and passes the Pages
# environment's branch rule.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Preview v2", "Preview cad"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: live

      - name: Check for a v2 branch
        id: v2
        run: |
          if git -C live ls-remote --exit-code --heads origin v2 >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.v2.outputs.exists == 'true'
        with:
          ref: v2
          path: preview

      - name: Check for a cad branch
        id: cad
        run: |
          if git -C live ls-remote --exit-code --heads origin cad >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.cad.outputs.exists == 'true'
        with:
          ref: cad
          path: cadsrc

      - uses: actions/setup-node@v4
        if: steps.cad.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cadsrc/package-lock.json

      # Publish only the app itself (not CLAUDE.md, README, tests etc.).
      # Stamp each service worker with its commit so phones pick up each deploy cleanly.
      - name: Assemble site
        run: |
          assemble() {
            src=$1; out=$2
            mkdir -p "$out"
            cp -r "$src/index.html" "$src/manifest.webmanifest" "$src/sw.js" "$src/icons" "$src/fonts" "$out/"
            if [ -d "$src/js" ]; then cp -r "$src/js" "$out/"; fi
            sha=$(git -C "$src" rev-parse --short HEAD)
            sed -i "s/const BUILD = \"dev\";/const BUILD = \"$sha\";/" "$out/sw.js"
            grep -q "const BUILD = \"$sha\";" "$out/sw.js"
          }
          assemble live _site
          if [ -d preview ]; then
            assemble preview _site/v2
            # Label the preview so it installs as a separate app next to the live one
            sed -i 's/"name": "Truss Spacer"/"name": "Truss Spacer v2 preview"/; s/"short_name": "Truss Spacer"/"short_name": "TS v2"/' _site/v2/manifest.webmanifest
            sed -i 's#<title>Truss Spacer</title>#<title>Truss Spacer v2 preview</title>#; s#<h1>Truss <span>Spacer</span></h1>#<h1>Truss <span>Spacer v2</span></h1>#' _site/v2/index.html
            grep -q "v2 preview" _site/v2/manifest.webmanifest
            grep -q "Spacer v2</span>" _site/v2/index.html
          fi
          find _site -maxdepth 2 | sort

      # The CAD preview is a TypeScript/Vite app: test and build it, then publish dist/ at /cad/
      - name: Build CAD preview
        if: steps.cad.outputs.exists == 'true'
        working-directory: cadsrc
        run: |
          npm ci
          npx vitest run
          BUILD_ID=$(git rev-parse --short HEAD) npm run build
          grep -q "const BUILD = \"$(git rev-parse --short HEAD)\";" dist/sw.js
          mkdir -p ../_site/cad && cp -r dist/. ../_site/cad/
          ls ../_site/cad

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
