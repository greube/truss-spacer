name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only the app itself (not CLAUDE.md, README etc.).
      # Stamp the service worker cache name with the commit so phones pick up each deploy cleanly.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js js icons fonts _site/
          sed -i "s/const VERSION = \"ts-v1\";/const VERSION = \"ts-${GITHUB_SHA::7}\";/" _site/sw.js
          grep -q "ts-${GITHUB_SHA::7}" _site/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
